<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Qoo10 Helper</title>
  </head>
  <body>
    <div class="header">
      <div class="title">Qoo10 Helper</div>
      <div class="badge" id="status-badge">대기 중</div>
    </div>

    <div class="row">
      <span class="label">백엔드</span>
      <span class="value" id="backend-status">확인 중…</span>
    </div>

    <div class="row">
      <span class="label">현재 작업</span>
      <span class="value" id="job-id">없음</span>
    </div>

    <div class="row">
      <span class="label">진행</span>
      <span class="value" id="progress">—</span>
    </div>

    <div class="row">
      <span class="label">성공 / 실패</span>
      <span class="value" id="success-error">0 / 0</span>
    </div>

    <div class="section-title">최근 5건</div>
    <ul class="recent" id="recent-list">
      <li class="empty">없음</li>
    </ul>

    <div class="actions">
      <button id="btn-poll">즉시 폴링</button>
      <button id="btn-refresh">새로고침</button>
    </div>

    <div class="footer" id="last-error"></div>

    <script src="popup.js"></script>
  </body>
</html>
